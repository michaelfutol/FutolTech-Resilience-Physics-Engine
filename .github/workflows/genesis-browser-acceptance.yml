name: Genesis Browser Acceptance

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/genesis-browser-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-phase4-house-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply inspectable Phase 4 staged viewer patch
        run: python scripts/patch-phase4-house-viewer.py

      - name: Commit staged viewer wiring if changed
        run: |
          git config user.name "RPE Phase 4 Viewer Patch Carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Viewport3D.tsx
          if git diff --cached --quiet; then
            echo "Phase 4 staged-house viewer already present."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Wire Phase 4 staged small-house viewer"
          git push origin HEAD:lum-rpe-takeover
