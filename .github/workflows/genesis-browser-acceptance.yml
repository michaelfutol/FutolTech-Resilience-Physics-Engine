name: Genesis Browser Acceptance

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/genesis-browser-acceptance.yml
      - scripts/genesis-browser-acceptance.mjs
      - src/components/Viewport3D.tsx
      - src/components/GenesisEventLedgerPanel.tsx
      - src/lib/genesis/**
      - src/types/genesis*.ts
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-live-aerodynamic-force:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply inspectable live aerodynamic force patch
        run: python scripts/patch-live-aero-force.py

      - name: Commit live force wiring if changed
        run: |
          git config user.name "RPE Live Force Patch Carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Viewport3D.tsx scripts/genesis-browser-acceptance.mjs
          if git diff --cached --quiet; then
            echo "Live aerodynamic force wiring already present."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Wire live post-release aerodynamic force"
          git push origin HEAD:lum-rpe-takeover
