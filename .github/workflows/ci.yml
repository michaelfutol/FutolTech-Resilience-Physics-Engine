name: RPE CI

on:
  push:
    branches:
      - futoltech-prototype-ui-3645265297782609075
      - lum-rpe-takeover
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript strict check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
