name: Roof Browser Acceptance Patch

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/roof-browser-acceptance-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-roof-browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply repaired inspectable roof browser patch
        run: python scripts/patch-roof-browser-acceptance.py

      - name: Commit browser acceptance if changed
        run: |
          git config user.name "RPE Roof Browser Patch Carrier"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/phase4-house-browser-acceptance.mjs
          if git diff --cached --quiet; then
            echo "Roof browser acceptance already patched."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Browser-test roof exposure readiness"
          git push origin HEAD:lum-rpe-takeover
