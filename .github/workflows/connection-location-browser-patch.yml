name: Connection Location Browser Patch

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/connection-location-browser-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout takeover branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply deterministic browser patch
        run: python scripts/patch-connection-location-browser-acceptance.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit patched acceptance script
        run: |
          if git diff --quiet -- scripts/phase4-house-browser-acceptance.mjs; then
            echo "No browser acceptance change was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/phase4-house-browser-acceptance.mjs
          git commit -m "Add connection location browser acceptance"
          git push origin HEAD:lum-rpe-takeover
