name: Structural Adapter Test Schema Patch

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/structural-adapter-test-schema-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout takeover branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply deterministic test schema repair
        run: python scripts/patch-structural-adapter-test-schema.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit structural adapter test schema repair
        run: |
          if git diff --quiet -- tests/small-house-structural-load-case-adapter.test.ts; then
            echo "No structural adapter test repair was produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/small-house-structural-load-case-adapter.test.ts
          git commit -m "Repair structural adapter test schema references"
          git push origin HEAD:lum-rpe-takeover
