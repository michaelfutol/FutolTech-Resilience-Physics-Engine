name: Connection Location Readiness Panel Patch

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/connection-location-readiness-panel-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-connection-location-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply inspectable connection-location panel patch
        run: python scripts/patch-connection-location-readiness-panel.py

      - name: Commit panel wiring if changed
        run: |
          git config user.name "RPE Connection Location Patch Carrier"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/Viewport3D.tsx
          if git diff --cached --quiet; then
            echo "Connection location panel already wired."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Wire connection joint-location review into Phase 4"
          git push origin HEAD:lum-rpe-takeover
