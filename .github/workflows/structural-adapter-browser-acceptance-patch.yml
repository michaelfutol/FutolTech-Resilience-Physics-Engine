name: Structural Adapter Browser Acceptance Patch

on:
  push:
    branches:
      - lum-rpe-takeover
    paths:
      - .github/workflows/structural-adapter-browser-acceptance-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout takeover branch
        uses: actions/checkout@v4
        with:
          ref: lum-rpe-takeover

      - name: Apply deterministic structural adapter browser patch
        run: python scripts/patch-structural-adapter-browser-acceptance.py

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit canonical structural adapter browser acceptance
        run: |
          if git diff --quiet -- src/components/SmallHouseSurfaceWindActionPanel.tsx scripts/phase4-house-browser-acceptance.mjs; then
            echo "No structural adapter browser acceptance changes were produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SmallHouseSurfaceWindActionPanel.tsx scripts/phase4-house-browser-acceptance.mjs
          git commit -m "Gate Phase 4 structural load-case adapter in browser acceptance"
          git push origin HEAD:lum-rpe-takeover
